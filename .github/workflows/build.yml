name: Build
on:
  push:
    branches:
      - Meta
  pull_request:
    branches:
      - Meta

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jobs:
          - {
              goos: linux,
              goarch: amd64,
              output: amd64,
              debian: amd64,
              rpm: x86_64,
              pacman: x86_64,
              goamd64: v3,
            }
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        if: ${{ matrix.jobs.goversion == '' && matrix.jobs.abi != '1' }}
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Set up Go
        if: ${{ matrix.jobs.goversion != '' && matrix.jobs.abi != '1' }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.jobs.goversion }}

      - name: Set variables
        run: |
          # 1. 设置 VERSION
          VERSION="${GITHUB_REF_NAME,,}-$(git rev-parse --short HEAD)"
          # 替换路径分隔符
          VERSION="${VERSION//\//-}"

          # 2. 默认 PackageVersion
          PackageVersion="0.0.0"

          # 3. 检查手动输入，如果存在则覆盖版本号
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION=${{ github.event.inputs.version }}
            PackageVersion="${VERSION#v}"
          fi

          # 导出变量供后续步骤使用
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "PackageVersion=${PackageVersion}" >> $GITHUB_ENV

          echo "BUILDTIME=$(date)" >> $GITHUB_ENV
          echo "CGO_ENABLED=0" >> $GITHUB_ENV
          echo "BUILDTAG=-extldflags --static" >> $GITHUB_ENV
          echo "GOTOOLCHAIN=local" >> $GITHUB_ENV

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt

      - name: Build core
        env:
          GOOS: ${{matrix.jobs.goos}}
          GOARCH: ${{matrix.jobs.goarch}}
          GOAMD64: ${{matrix.jobs.goamd64}}
          GO386: ${{matrix.jobs.go386}}
          GOARM: ${{matrix.jobs.goarm}}
          GOMIPS: ${{matrix.jobs.gomips}}
        run: |
          go env
          go build -v -tags "with_gvisor" -trimpath -ldflags "${BUILDTAG} -X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid="
          cp mihomo mihomo-${{matrix.jobs.goos}}-${{matrix.jobs.output}}
          gzip -c mihomo-${{matrix.jobs.goos}}-${{matrix.jobs.output}} > mihomo-${{matrix.jobs.goos}}-${{matrix.jobs.output}}.gz

      - name: Save version
        run: |
          echo ${VERSION} > version.txt
        shell: bash

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}"
          path: |
            mihomo*.gz
            mihomo*.deb
            mihomo*.rpm
            mihomo*.pkg.tar.zst
            mihomo*.zip
            version.txt
            checksums.txt

  Upload-Release:
    permissions: write-all
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: Meta
          fetch-depth: "0"
          fetch-tags: "true"

      - uses: actions/download-artifact@v4
        with:
          path: bin/
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R
        working-directory: bin

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        with:
          tag_name: v0.0.0
          files: bin/*
          body_path: release.md
          overwrite_files: true
